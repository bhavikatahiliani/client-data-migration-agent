<!doctype html><html><head><title>Migration Agent</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="wrap"><header><div><h1>AI Data Migration Agent</h1><p>Autonomous migration with human supervision.</p></div><form action="/demo" method="post"><button class="primary">Load Demo Dataset</button></form></header><section class="card"><h2>Upload client exports</h2><form action="/upload" method="post" enctype="multipart/form-data"><input type="file" name="files" multiple accept=".csv,.xlsx"><button class="primary">Start Migration</button></form><p class="muted">CSV and XLSX supported. Multiple files may represent the same entity.</p></section><section><h2>Recent migrations</h2>{% for m in migrations %}<a class="card row" href="/migration/{{m.id}}"><span><b>{{m.id[:8]}}</b><small>{{m.created_at}}</small></span><span class="pill">{{m.status}}</span></a>{% else %}<div class="card muted">No migrations yet.</div>{% endfor %}</section></main></body></html>
